name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test (iOS Simulator)
    # The app targets iOS 26.0 and is kept in Xcode 26.6, so the job needs the iOS 26 SDK.
    # macos-14 tops out at Xcode 16.2 and is retired on 2026-11-02; macos-15 ships Xcode 26.x.
    runs-on: macos-15
    timeout-minutes: 45

    env:
      PROJECT: app/SmartBud.xcodeproj
      SCHEME: SmartBud
      DESTINATION: platform=iOS Simulator,name=iPhone 16
      RESULT_BUNDLE: TestResults.xcresult
      LOG_FILE: xcodebuild-test.log

    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26
        run: |
          chosen=""
          for version in 26.6 26.5 26.4 26.3 26.2 26.1.1 26.1 26.0.1 26.0; do
            candidate="/Applications/Xcode_${version}.app"
            if [ -d "$candidate" ]; then
              chosen="$candidate"
              break
            fi
          done
          if [ -z "$chosen" ]; then
            echo "No Xcode 26 found on this image; the iOS 26 SDK is required." >&2
            ls -d /Applications/Xcode*.app >&2
            exit 1
          fi
          sudo xcode-select -s "$chosen"
          xcodebuild -version

      # No Swift packages today; the step activates once a Package.resolved lands.
      - name: Cache Swift Package dependencies
        if: hashFiles('**/Package.resolved') != ''
        uses: actions/cache@v6
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # The scheme also carries `SmartBudUITests`; this job stays the fast
      # logic-test gate, the ui-test job below owns the simulator interaction
      # cases.
      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -only-testing:SmartBudTests \
            -resultBundlePath "$RESULT_BUNDLE" \
            2>&1 | tee "$LOG_FILE"

      - name: Summarise test count
        if: success()
        run: |
          swift_testing=$(grep -E "Test run with [0-9]+ test" "$LOG_FILE" | tail -1 || true)
          xctest=$(grep -E "Executed [0-9]+ test" "$LOG_FILE" | tail -1 || true)
          echo "### ${swift_testing:-${xctest:-test count line not found}}" >> "$GITHUB_STEP_SUMMARY"

      # Runs even when the metrics test fails, so a red run still shows which
      # number moved. The line is emitted by ParsingMetricsTests; see docs/ai-eval.md.
      - name: Parsing metrics
        if: always()
        run: |
          line=$(grep -o 'METRICS .*' "$LOG_FILE" | head -1 || true)
          detail=$(grep -o 'METRICS_DETAIL .*' "$LOG_FILE" | head -1 || true)
          {
            echo "### Parsing metrics"
            echo
            if [ -z "$line" ]; then
              echo "测试日志里没有 METRICS 行：解析指标测试没跑到（先看上面的编译/测试失败）。"
              exit 0
            fi
            if [ -n "$detail" ]; then
              echo "\`${detail#METRICS_DETAIL }\`"
              echo
            fi
            echo "| 指标 | 当前 | 门槛（不得低于） |"
            echo "| --- | --- | --- |"
            for pair in ${line#METRICS }; do
              key=${pair%%=*}
              value=${pair#*=}
              current=${value%%/*}
              floor=${value#*/}
              case "$key" in
                text_amount) label="金额准确率（文本）" ;;
                text_direction) label="方向准确率（文本）" ;;
                text_category) label="分类 top-1（文本）" ;;
                text_end_to_end) label="端到端一次通过率（文本）" ;;
                receipt_amount) label="金额准确率（小票）" ;;
                target_amount) label="金额准确率目标" ;;
                status) label="门槛结论" ;;
                *) label="$key" ;;
              esac
              if [ "$key" = "status" ]; then
                echo "| $label | $current | — |"
              elif [ "$key" = "target_amount" ]; then
                echo "| $label | ${current}% | — |"
              else
                echo "| $label | ${current}% | ${floor}% |"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults
          path: |
            TestResults.xcresult
            xcodebuild-test.log
          if-no-files-found: warn
          retention-days: 7

  ui-test:
    name: UI flow matrix (XCUITest, iPhone)
    # Same image and Xcode selection as the logic-test job: the UI cases need
    # the iOS 26 SDK and a bootable iPhone 16 simulator, nothing else.
    #
    # 15 minutes is the budget from TELE-35: the matrix is ~35 cases of one
    # short flow each, and a case that needs a longer wait than the budget is a
    # hang, not a slow test. Measured wall time is in the job summary.
    runs-on: macos-15
    timeout-minutes: 15

    env:
      PROJECT: app/SmartBud.xcodeproj
      SCHEME: SmartBud
      DESTINATION: platform=iOS Simulator,name=iPhone 16
      RESULT_BUNDLE: UITestResults.xcresult
      LOG_FILE: xcodebuild-uitest.log

    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26
        run: |
          chosen=""
          for version in 26.6 26.5 26.4 26.3 26.2 26.1.1 26.1 26.0.1 26.0; do
            candidate="/Applications/Xcode_${version}.app"
            if [ -d "$candidate" ]; then
              chosen="$candidate"
              break
            fi
          done
          if [ -z "$chosen" ]; then
            echo "No Xcode 26 found on this image; the iOS 26 SDK is required." >&2
            ls -d /Applications/Xcode*.app >&2
            exit 1
          fi
          sudo xcode-select -s "$chosen"
          xcodebuild -version

      # Every case launches the app with -skipIntro / -importSample (DEBUG-only
      # hooks) and queries accessibility identifiers from AccessibilityID.swift.
      - name: UI tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -only-testing:SmartBudUITests \
            -testLanguage en \
            -testRegion US \
            -resultBundlePath "$RESULT_BUNDLE" \
            2>&1 | tee "$LOG_FILE"

      - name: Summarise UI test results
        if: always()
        run: |
          {
            echo "### UI smoke tests"
            echo
            passed=$(grep -c "Test Case '-\[SmartBudUITests .*\]' passed" "$LOG_FILE" || true)
            failed=$(grep -c "Test Case '-\[SmartBudUITests .*\]' failed" "$LOG_FILE" || true)
            skipped=$(grep -c "Test Case '-\[SmartBudUITests .*\]' skipped" "$LOG_FILE" || true)
            echo "passed: ${passed:-0} · failed: ${failed:-0} · skipped: ${skipped:-0}"
            echo
            echo "### Accessibility audit"
            echo
            if grep -q "AUDIT\[" "$LOG_FILE"; then
              echo '```'
              grep -o "AUDIT\[.*" "$LOG_FILE" | sort | uniq -c | sort -rn | head -60
              echo '```'
            else
              echo "没有 AUDIT 行：审计没跑到，先看上面的编译/用例失败。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Always, not only on failure: the audit report and the screenshots are
      # the point of the job.
      - name: Upload UI test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: UITestResults
          path: |
            UITestResults.xcresult
            xcodebuild-uitest.log
          if-no-files-found: warn
          retention-days: 7

  ui-layout:
    name: UI layout matrix (XCUITest, small phone + iPad)
    # The layout cases from TELE-35 M20 need device classes the main UI job
    # does not boot: a 667pt-tall phone for the "no scrolling" rule and an iPad
    # for the NavigationSplitView shell. They run here, in parallel with the
    # main job, so the whole UI budget stays under 15 minutes wall clock.
    runs-on: macos-15
    timeout-minutes: 15

    env:
      PROJECT: app/SmartBud.xcodeproj
      SCHEME: SmartBud

    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26
        run: |
          chosen=""
          for version in 26.6 26.5 26.4 26.3 26.2 26.1.1 26.1 26.0.1 26.0; do
            candidate="/Applications/Xcode_${version}.app"
            if [ -d "$candidate" ]; then
              chosen="$candidate"
              break
            fi
          done
          if [ -z "$chosen" ]; then
            echo "No Xcode 26 found on this image; the iOS 26 SDK is required." >&2
            ls -d /Applications/Xcode*.app >&2
            exit 1
          fi
          sudo xcode-select -s "$chosen"
          xcodebuild -version

      # Device names move between Xcode releases ("iPhone SE (3rd generation)"
      # is gone on some images), so the destination is resolved by prefix and
      # the job fails loudly when the image has no such device class.
      - name: Resolve destinations
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, os, subprocess, sys

          data = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "-j"]))
          devices = []
          for runtime, entries in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for entry in entries:
                  devices.append(entry["name"])

          def pick(prefix, label):
              for name in devices:
                  if name.startswith(prefix):
                      return name
              print(f"::error::No available simulator named like '{prefix}' for {label}. "
                    f"Available: {sorted(set(devices))}", file=sys.stderr)
              sys.exit(1)

          print(f"SMALL_PHONE={pick('iPhone SE', 'the small-phone cases')}")
          print(f"TABLET={pick('iPad', 'the split-view cases')}")
          PY
          echo "resolved: $SMALL_PHONE / $TABLET"

      - name: Layout tests (small phone)
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=$SMALL_PHONE" \
            -only-testing:SmartBudUITests/LayoutUITests/testM20_smallPhone_primaryPathVisibleWithoutScrolling \
            -only-testing:SmartBudUITests/LayoutUITests/testM20_entryFormLandscape_primaryPathStillReachable \
            -testLanguage en \
            -testRegion US \
            -resultBundlePath LayoutPhone.xcresult \
            2>&1 | tee layout-phone.log

      - name: Layout tests (iPad)
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=$TABLET" \
            -only-testing:SmartBudUITests/LayoutUITests/testM20_ipadSplitView_navigatesBetweenSections \
            -testLanguage en \
            -testRegion US \
            -resultBundlePath LayoutTablet.xcresult \
            2>&1 | tee layout-tablet.log

      - name: Upload layout artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: LayoutResults
          path: |
            LayoutPhone.xcresult
            LayoutTablet.xcresult
            layout-phone.log
            layout-tablet.log
          if-no-files-found: warn
          retention-days: 7
