name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test (iOS Simulator)
    # The app targets iOS 26.0 and is kept in Xcode 26.6, so the job needs the iOS 26 SDK.
    # macos-14 tops out at Xcode 16.2 and is retired on 2026-11-02; macos-15 ships Xcode 26.x.
    runs-on: macos-15
    timeout-minutes: 45

    env:
      PROJECT: app/SmartBud.xcodeproj
      SCHEME: SmartBud
      DESTINATION: platform=iOS Simulator,name=iPhone 16
      RESULT_BUNDLE: TestResults.xcresult
      LOG_FILE: xcodebuild-test.log

    steps:
      - uses: actions/checkout@v7

      # Cheap, Xcode-free checks first: a dangling pbxproj path or a stray
      # identifier fails here in seconds instead of after a full macOS build.
      - name: Offline structure check
        run: python3 scripts/check_repo.py

      - name: Select Xcode 26
        run: |
          chosen=""
          for version in 26.6 26.5 26.4 26.3 26.2 26.1.1 26.1 26.0.1 26.0; do
            candidate="/Applications/Xcode_${version}.app"
            if [ -d "$candidate" ]; then
              chosen="$candidate"
              break
            fi
          done
          if [ -z "$chosen" ]; then
            echo "No Xcode 26 found on this image; the iOS 26 SDK is required." >&2
            ls -d /Applications/Xcode*.app >&2
            exit 1
          fi
          sudo xcode-select -s "$chosen"
          xcodebuild -version

      # Parser-only pass over all five targets (app, unit tests, UI tests,
      # widget, macOS shell): seconds, no SDK, and it fails on the line that no
      # longer parses instead of after the build below. Type errors still need
      # the build; see docs/engineering.md § 离线语法检查.
      - name: Swift syntax check
        run: scripts/check-syntax.sh

      # No Swift packages today; the step activates once a Package.resolved lands.
      - name: Cache Swift Package dependencies
        if: hashFiles('**/Package.resolved') != ''
        uses: actions/cache@v6
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # The scheme also carries `SmartBudUITests`; this job stays the fast
      # logic-test gate, the ui-test job below owns the simulator interaction
      # cases.
      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -destination-timeout 300 \
            -only-testing:SmartBudTests \
            -resultBundlePath "$RESULT_BUNDLE" \
            2>&1 | tee "$LOG_FILE"

      # A filter that matches nothing makes xcodebuild exit 0 after running zero
      # cases. The UI shards below guard against that; this job had no such
      # guard, so a broken -only-testing target would have reported green.
      #
      # Note the two frameworks: this suite is Swift Testing, so XCTest's own
      # "Executed 0 tests" line is normal and NOT a failure signal — the count
      # that matters is "✔ Test run with N tests".
      - name: Logic tests actually ran
        if: success()
        run: |
          if ! grep -qE "Test run with [1-9][0-9]* test|Executed [1-9][0-9]* test" "$LOG_FILE"; then
            echo "::error::No test cases executed. Check that -only-testing:SmartBudTests still matches a target with test sources."
            exit 1
          fi

      - name: Summarise test count
        if: success()
        run: |
          swift_testing=$(grep -E "Test run with [0-9]+ test" "$LOG_FILE" | tail -1 || true)
          xctest=$(grep -E "Executed [0-9]+ test" "$LOG_FILE" | tail -1 || true)
          echo "### ${swift_testing:-${xctest:-test count line not found}}" >> "$GITHUB_STEP_SUMMARY"

      # Runs even when the metrics test fails, so a red run still shows which
      # number moved. The line is emitted by ParsingMetricsTests; see docs/ai-eval.md.
      - name: Parsing metrics
        if: always()
        run: |
          line=$(grep -o 'METRICS .*' "$LOG_FILE" | head -1 || true)
          detail=$(grep -o 'METRICS_DETAIL .*' "$LOG_FILE" | head -1 || true)
          {
            echo "### Parsing metrics"
            echo
            if [ -z "$line" ]; then
              echo "测试日志里没有 METRICS 行：解析指标测试没跑到（先看上面的编译/测试失败）。"
              exit 0
            fi
            if [ -n "$detail" ]; then
              echo "\`${detail#METRICS_DETAIL }\`"
              echo
            fi
            echo "| 指标 | 当前 | 门槛（不得低于） |"
            echo "| --- | --- | --- |"
            for pair in ${line#METRICS }; do
              key=${pair%%=*}
              value=${pair#*=}
              current=${value%%/*}
              floor=${value#*/}
              case "$key" in
                text_amount) label="金额准确率（文本）" ;;
                text_direction) label="方向准确率（文本）" ;;
                text_category) label="分类 top-1（文本）" ;;
                text_end_to_end) label="端到端一次通过率（文本）" ;;
                receipt_amount) label="金额准确率（小票）" ;;
                target_amount) label="金额准确率目标" ;;
                status) label="门槛结论" ;;
                *) label="$key" ;;
              esac
              if [ "$key" = "status" ]; then
                echo "| $label | $current | — |"
              elif [ "$key" = "target_amount" ]; then
                echo "| $label | ${current}% | — |"
              else
                echo "| $label | ${current}% | ${floor}% |"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults
          path: |
            TestResults.xcresult
            xcodebuild-test.log
          if-no-files-found: warn
          retention-days: 7

  ui-test:
    name: UI ${{ matrix.label }} (XCUITest)
    # Same image and Xcode selection as the logic-test job: the UI cases need
    # the iOS 26 SDK and a bootable iPhone 16 simulator, nothing else.
    #
    # Four e2e shards plus the smoke shard: the nine E2E cases cost 1459 s of
    # case time on macos-15 (run 44026222552: A1 102 s, A2 141 s, A3 110 s,
    # A4 167 s, A5 159 s, A6 227 s, A7 179 s, A8 179 s, A9 204 s), so three
    # shards put two of them past the 10-minute budget. Shards are balanced on
    # measured case time, not on case count; the slowest now sits at ~6.8
    # minutes. A new case must be added to one of `tests` below — the smoke
    # shard skips every E2E case by name.
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: smoke
            label: smoke
            filter: skip
            tests: >-
              testA1_addExpense_updatesStats
              testA2_continuousEntry_clearsAmountKeepsCategory
              testA3_invalidInput_isRefusedWithMessage
              testA4_discountClaimFutureDate_staysOutOfStats
              testA5_editAmount_updatesStats_typeSwitchClearsCategory
              testA6_deleteUndo_restoresFieldsAndBalance
              testA7_sameCurrencyTransfer_movesBalancesOnly
              testA8_crossCurrencyTransfer_feeOnlyInSpend
              testA9_budgetRemaining_dropsThenGoesOver
              testA10_refund_reducesSpendWithoutIncome
          - key: e2e-entry
            label: e2e 记账/校验
            filter: only
            tests: >-
              testA1_addExpense_updatesStats
              testA2_continuousEntry_clearsAmountKeepsCategory
              testA3_invalidInput_isRefusedWithMessage
          - key: e2e-edit
            label: e2e 折扣/编辑
            filter: only
            tests: >-
              testA4_discountClaimFutureDate_staysOutOfStats
              testA5_editAmount_updatesStats_typeSwitchClearsCategory
              testA10_refund_reducesSpendWithoutIncome
          - key: e2e-ledger
            label: e2e 删除/转账
            filter: only
            tests: >-
              testA6_deleteUndo_restoresFieldsAndBalance
              testA7_sameCurrencyTransfer_movesBalancesOnly
          - key: e2e-budget
            label: e2e 跨币种/预算
            filter: only
            tests: >-
              testA8_crossCurrencyTransfer_feeOnlyInSpend
              testA9_budgetRemaining_dropsThenGoesOver

    env:
      PROJECT: app/SmartBud.xcodeproj
      SCHEME: SmartBud
      DESTINATION: platform=iOS Simulator,name=iPhone 16
      RESULT_BUNDLE: UITestResults.xcresult
      LOG_FILE: xcodebuild-uitest.log

    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26
        run: |
          chosen=""
          for version in 26.6 26.5 26.4 26.3 26.2 26.1.1 26.1 26.0.1 26.0; do
            candidate="/Applications/Xcode_${version}.app"
            if [ -d "$candidate" ]; then
              chosen="$candidate"
              break
            fi
          done
          if [ -z "$chosen" ]; then
            echo "No Xcode 26 found on this image; the iOS 26 SDK is required." >&2
            ls -d /Applications/Xcode*.app >&2
            exit 1
          fi
          sudo xcode-select -s "$chosen"
          xcodebuild -version

      # A fresh runner can spend ~60s before CoreSimulatorService answers, and
      # xcodebuild then gives up with "Unable to find a device matching" even
      # though the iPhone 16 / iOS 26.2 device exists (observed on run
      # 43553153061: the two e2e shards died after 66s, the logic job on the
      # same image resolved the same destination after 38s). Boot it once and
      # keep a generous destination timeout so a slow lookup is not fatal.
      - name: Boot iPhone 16 simulator
        run: |
          xcrun simctl list devices available | grep "iPhone 16 (" || true
          xcrun simctl boot "iPhone 16" || true
          xcrun simctl bootstatus "iPhone 16" -b

      # Every case launches the app with -skipIntro / -importSample (DEBUG-only
      # hooks) and queries accessibility identifiers from AccessibilityID.swift.
      - name: UI tests
        run: |
          set -o pipefail
          # xcodebuild test identifiers are Target/Class/Method. The shorter
          # "Target/method" form silently matches nothing, which is how a
          # shard can report success after running zero tests.
          #
          # Multiple -only-testing flags are a union, so the "only" shards must
          # NOT also pass the target-level filter: that would select every case
          # again. The "skip" shard keeps the target-level filter and subtracts
          # the E2E cases by name.
          filters=()
          if [ "${{ matrix.filter }}" = "only" ]; then
            for test in ${{ matrix.tests }}; do
              filters+=("-only-testing:SmartBudUITests/SmartBudUITests/${test}")
            done
          else
            filters+=("-only-testing:SmartBudUITests")
            for test in ${{ matrix.tests }}; do
              filters+=("-skip-testing:SmartBudUITests/SmartBudUITests/${test}")
            done
          fi
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -destination-timeout 300 \
            "${filters[@]}" \
            -testLanguage en \
            -testRegion US \
            -resultBundlePath "$RESULT_BUNDLE" \
            2>&1 | tee "$LOG_FILE"

      # A filter that matches nothing makes xcodebuild exit 0 after running
      # zero cases — a vacuous green. Fail the shard instead of reporting it.
      - name: Shard ran at least one case
        run: |
          if ! grep -q "Test Case '-\[SmartBudUITests\." "$LOG_FILE"; then
            echo "::error::This shard executed no SmartBudUITests cases; check the -only-testing/-skip-testing identifiers."
            exit 1
          fi

      - name: Summarise UI test results
        if: always()
        run: |
          {
            echo "### UI smoke tests"
            echo
            passed=$(grep -c "Test Case '-\[SmartBudUITests\..*\]' passed" "$LOG_FILE" || true)
            failed=$(grep -c "Test Case '-\[SmartBudUITests\..*\]' failed" "$LOG_FILE" || true)
            echo "passed: ${passed:-0} · failed: ${failed:-0}"
            echo
            echo "### Accessibility audit"
            echo
            if grep -q "AUDIT\[" "$LOG_FILE"; then
              echo '```'
              grep -o "AUDIT\[.*" "$LOG_FILE" | sort | uniq -c | sort -rn | head -60
              echo '```'
            else
              echo "没有 AUDIT 行：审计没跑到，先看上面的编译/用例失败。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Always, not only on failure: the audit report and the screenshots are
      # the point of the job.
      - name: Upload UI test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: UITestResults-${{ matrix.key }}
          path: |
            UITestResults.xcresult
            xcodebuild-uitest.log
          if-no-files-found: warn
          retention-days: 7
